# this file is part of RuneAudio
# ------------------------------
#
# filename: /etc/alsa/conf.d/99-runeaudio.conf
#
#
# configuration for ALSA Equaliser - alsaequal
# --------------------------------------------
#
pcm.!default {
type plug
slave.pcm plugequal;
}
ctl.!default {
type hw card 0
}
ctl.equal {
type equal;
}
pcm.plugequal {
type equal;
slave.pcm "plughw:1,0"; # NOTE this line MUST be your hardware device.
}
pcm.equal {
type plug;
slave.pcm plugequal;
}
#
#
# configuration of default rate converter plugin
# ----------------------------------------------
#
defaults.pcm.rate_converter "samplerate_best"
# the alternatives
# defaults.pcm.rate_converter "lavcrate_higher" # converts everything to 48k sample rate using ffmpeg using its highest quality level
# defaults.pcm.rate_converter "samplerate_best" # the standard rate converter using its highest quality level
# defaults.pcm.rate_converter "speexrate_best" # rate converter designed for speech compression using its highest quality level
#
