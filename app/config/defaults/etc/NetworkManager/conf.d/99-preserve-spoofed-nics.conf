# This is part of RuneAudio
#
# This configuration file preserves spoofed mac addresses and makes sure they are passed to the router
#   Its important when using cheap network cards which all have the same mac address,
#   Also see the files /etc/systemd/network/99-rune-*-mac-fix.link which define the spoofing
#
[connection]
ethernet.cloned-mac-address=preserve
wifi.cloned-mac-address=preserve
#
# end of file
