###############################################################################
#                       RuneAudio Redis configuration
###############################################################################

################################ GENERAL  #####################################
daemonize no
pidfile "/run/redis/redis.pid"
#bind 127.0.0.1
#port 6379
#port 0
tcp-backlog 511
unixsocket "/run/redis/socket"
unixsocketperm 777
timeout 0
tcp-keepalive 0
loglevel warning
logfile "/var/log/runeaudio/redis.log"
#logfile ""
databases 1
## Save the DB on disk: when at least 1 change in 900 seconds (15 min.) or 40 changes in 300 seconds (5 min.) or 400 changes in 30 seconds have occurred
# save 900 1 300 40 30 400
# Claude advice: Save the DB on disk: when at least 1 change in 3600 seconds (60 min.) or 900 changes in 10 seconds
save 3600 1 900 10
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename "rune.rdb"
dir "/var/lib/redis"

################################# REPLICATION #################################
replica-serve-stale-data yes
replica-read-only yes
repl-disable-tcp-nodelay no
replica-priority 100

################################### CLIENTS ####################################
maxclients 100

############################## MEMORY MANAGEMENT ################################
maxmemory 15625kb

############################# LAZY FREEING ####################################
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

############################## APPEND ONLY MODE ###############################

appendonly no
appendfilename "appendonly.aof"
appendfsync no
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

################################ LUA SCRIPTING  ###############################
busy-reply-threshold 5000

################################## SLOW LOG ###################################
slowlog-log-slower-than 10000
slowlog-max-len 128

################################ LATENCY MONITOR ##############################
latency-monitor-threshold 0

############################# Event notification ##############################
notify-keyspace-events ""

############################### ADVANCED CONFIG ###############################
hash-max-listpack-entries 512
hash-max-listpack-value 64
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000
activerehashing no
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 5
aof-rewrite-incremental-fsync yes
