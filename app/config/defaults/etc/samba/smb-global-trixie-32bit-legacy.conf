# Trixie legacy single processor
# Trixie legacy single processor
[global]
   workgroup = WORKGROUP
   server string = RuneAudio %h Samba %v
   dns proxy = no
   log level = 0
   map to guest = bad user
   # --- Network Interfaces ---
   bind interfaces only = yes
   # Note: If you don't use all these interfaces (like eth1, eth2),
   # removing them will stop Samba from throwing harmless startup warnings in the syslog.
   interfaces = lo eth0 eth1 eth2 wlan0 wlan1 wlan2
   # --- CPU & Crypto Overhead Reduction (Crucial for Single-Core) ---
   min protocol = SMB2
   max protocol = SMB3
   smb encrypt = off
   server signing = disabled
   strict locking = no
   strict sync = no
   sync change notify = no
   # --- Network Performance ---
   socket options = TCP_NODELAY SO_RCVBUF=65536 SO_SNDBUF=65536
   # --- Disable NetBIOS & WINS (Saves RAM/CPU) ---
   disable netbios = yes
   wins support = no
   name resolve order = host
   # --- Disable Printing Bloat ---
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # --- Modern RPC Optimizations ---
   rpc_daemon:smbd = embedded
   rpc start on demand helpers = true
   registry shares = no
   include system = no
   # --- File Permissions ---
   directory mask = 0775
   create mask = 0664
