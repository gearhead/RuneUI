# Trixie 64-bit multiprocessor
[global]
   workgroup = WORKGROUP
   server string = RuneAudio %h Samba %v
   bind interfaces only = yes
   interfaces = lo eth0 eth1 eth2 wlan0 wlan1 wlan2
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 2000
   logging = file
   map to guest = bad user
   server min protocol = SMB3
   client min protocol = SMB3
   server signing = mandatory
   smb encrypt = required
   disable netbios = yes
   wins support = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   aio read size = 1
   aio write size = 1
   log level = 0
   directory mask = 0775
   create mask = 0664
   socket options = TCP_NODELAY
   strict locking = no

