# Trixie 32-bit multiprocessor
[global]
   workgroup = WORKGROUP
   server string = RuneAudio %h Samba %v
   bind interfaces only = yes
   interfaces = lo eth0 eth1 eth2 wlan0 wlan1 wlan2
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   map to guest = bad user
   server min protocol = SMB2_10
   client min protocol = SMB3
   server signing = default
   smb encrypt = auto
   disable netbios = yes
   wins support = no
   name resolve order = host
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   registry shares = no
   include system = no
   log level = 0
   directory mask = 0775
   create mask = 0664
   socket options = TCP_NODELAY
   strict locking = no
   aio read size = 1
   aio write size = 1
